<?xml version="1.0" encoding="UTF-8"?>
<!-- MasonOS Aurorae frame — a complete window frame, not a floating title strip.

     The earlier version had BorderLeft/Right/Bottom=0 and painted only the
     titlebar. KWin then derives the frame from a single 24px top edge, and after
     state changes (maximize, fullscreen, a compositor restart) the client and
     the frame could desynchronise: the bar was drawn as a detached strip, or not
     at all, while the title text and buttons kept painting — a see-through
     titlebar over the window contents.

     So: 1px side and bottom borders (BorderLeft/Right/Bottom=1 in MasonOSrc),
     the titlebar across the top, rounded top corners, and every fill a literal
     colour (no gradient or element references — those can fail to resolve while
     literal ones keep painting, which is what produced the invisible bar).

     Canvas = BorderLeft(1) + TitleEdgeLeft(10) + stretched middle + 10 + 1, by
     TitleHeight(24) + BorderBottom(1). -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="25" viewBox="0 0 48 25">
  <!-- rounded top-left + its part of the side border -->
  <g id="decoration-topleft">
    <path d="M1 10 A9 9 0 0 1 10 1 L10 25 L1 25 Z" fill="#17171e"/>
    <path d="M1.5 10 A8.5 8.5 0 0 1 10 1.5" fill="none" stroke="#c4b5fd" stroke-opacity="0.28" stroke-width="1"/>
  </g>
  <!-- titlebar (stretched horizontally) -->
  <g id="decoration-top">
    <rect x="0" y="0" width="48" height="24" fill="#17171e"/>
    <rect x="0" y="0" width="48" height="1" fill="#c4b5fd" fill-opacity="0.13"/>
  </g>
  <!-- rounded top-right -->
  <g id="decoration-topright">
    <path d="M38 1 A9 9 0 0 1 47 10 L47 25 L38 25 Z" fill="#17171e"/>
    <path d="M47 10 A8.5 8.5 0 0 0 38 1.5" fill="none" stroke="#c4b5fd" stroke-opacity="0.28" stroke-width="1"/>
  </g>

  <!-- side borders, 1px, stretched down the window -->
  <g id="decoration-left"><rect x="0" y="0" width="1" height="25" fill="#23232d"/></g>
  <g id="decoration-right"><rect x="47" y="0" width="1" height="25" fill="#23232d"/></g>
  <!-- client area edge (no fill) and bottom border -->
  <g id="decoration-center"><rect x="1" y="24" width="46" height="1" fill="#000000" fill-opacity="0"/></g>
  <g id="decoration-bottom"><rect x="1" y="24" width="46" height="1" fill="#23232d"/></g>
  <g id="decoration-bottomleft"><rect x="0" y="24" width="1" height="1" fill="#23232d"/></g>
  <g id="decoration-bottomright"><rect x="47" y="24" width="1" height="1" fill="#23232d"/></g>

  <!-- inactive -->
  <g id="decoration-inactive-topleft">
    <path d="M1 10 A9 9 0 0 1 10 1 L10 25 L1 25 Z" fill="#121217"/>
  </g>
  <g id="decoration-inactive-top">
    <rect x="0" y="0" width="48" height="24" fill="#121217"/>
  </g>
  <g id="decoration-inactive-topright">
    <path d="M38 1 A9 9 0 0 1 47 10 L47 25 L38 25 Z" fill="#121217"/>
  </g>
  <g id="decoration-inactive-left"><rect x="0" y="0" width="1" height="25" fill="#1b1b22"/></g>
  <g id="decoration-inactive-right"><rect x="47" y="0" width="1" height="25" fill="#1b1b22"/></g>
  <g id="decoration-inactive-center"><rect x="1" y="24" width="46" height="1" fill="#000000" fill-opacity="0"/></g>
  <g id="decoration-inactive-bottom"><rect x="1" y="24" width="46" height="1" fill="#1b1b22"/></g>
  <g id="decoration-inactive-bottomleft"><rect x="0" y="24" width="1" height="1" fill="#1b1b22"/></g>
  <g id="decoration-inactive-bottomright"><rect x="47" y="24" width="1" height="1" fill="#1b1b22"/></g>
</svg>
