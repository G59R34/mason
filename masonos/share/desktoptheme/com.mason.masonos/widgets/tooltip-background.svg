<?xml version="1.0" encoding="UTF-8"?>
<!-- MasonOS tooltip / popup frame. 64x64 canvas, 8px 9-slice margins. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="mason-popup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15151b"/>
      <stop offset="1" stop-color="#0d0d11"/>
    </linearGradient>
  </defs>

  <rect id="center" x="8" y="8" width="48" height="48" fill="url(#mason-popup)"/>

  <rect id="top" x="8" y="0" width="48" height="8" fill="url(#mason-popup)"/>
  <rect id="bottom" x="8" y="56" width="48" height="8" fill="url(#mason-popup)"/>
  <rect id="left" x="0" y="8" width="8" height="48" fill="url(#mason-popup)"/>
  <rect id="right" x="56" y="8" width="8" height="48" fill="url(#mason-popup)"/>

  <path id="topleft" d="M8 8 A8 8 0 0 1 0 8 L0 8 Z" fill="url(#mason-popup)"/>
  <path id="topright" d="M56 0 A8 8 0 0 1 64 8 L56 8 Z" fill="url(#mason-popup)"/>
  <path id="bottomleft" d="M0 56 A8 8 0 0 1 8 64 L0 64 Z" fill="url(#mason-popup)"/>
  <path id="bottomright" d="M64 56 A8 8 0 0 1 56 64 L64 64 Z" fill="url(#mason-popup)"/>

  <rect id="shadow-top" x="0" y="0" width="64" height="1" fill="#c4b5fd" fill-opacity="0.22"/>
</svg>
